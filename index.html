    :root {
      --app-font: 'Cairo', 'Noto Naskh Arabic', sans-serif;
      --app-align: right;
      --app-font-size: 16px;
    }

    :root {
      --bg: #f8f1e3;
      --card: #fffdf8;
      --gold: #c9a227;
      --gold-dark: #a67c00;
      --brown: #5c4033;
      --text: #3e2f1c;
      --light-cross: #e8d9b5;
      --green: #5a7d4a;
      --shadow: 0 4px 15px rgba(92, 64, 51, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100vw;
      width: 100%;
    }


    /* خط التطبيق على كل الواجهة والأيقونات */
    body, button, input, textarea, select, .icon-label, .text-box, .text-box-title,
    .modal-title, .action-btn, .save-btn, .align-btn, .helper-btn, .section-title,
    .day-name, .date-nav, .verse-line, .prayer-content, #prayerContent, #prayerTitle {
      font-family: var(--app-font) !important;
    }
    body {
      font-size: var(--app-font-size);
      text-align: var(--app-align);
    }
    .icon-label {
      font-size: calc(var(--app-font-size) * 0.75);
    }
    body {
      font-family: var(--app-font); font-size: var(--app-font-size); text-align: var(--app-align);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* خلفية الصلبان فقط */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M18 8h4v10h10v4H22v10h-4V22H8v-4h10V8z' fill='%23e8d9b5' fill-opacity='0.4'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 10px;
      position: relative;
      z-index: 1;
      overflow-x: hidden;
      background: transparent;
    }

    /* Header / Logo */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 8px;
      box-shadow: 0 4px 15px rgba(201, 162, 39, 0.3);
      overflow: hidden;
      border: 3px solid var(--gold);
      background: transparent;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 12px 0 18px;
    }

    .date-nav button {
      background: rgba(255,253,248,0.35);
      border: 1px solid rgba(201,162,39,0.4);
      color: var(--brown);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .date-nav button:active {
      transform: scale(0.92);
      background: var(--gold);
      color: white;
    }

    .current-date {
      font-size: 18px;
      font-weight: 600;
      color: var(--brown);
      min-width: 180px;
      text-align: center;
    }

    /* كروت المحتوى = شكل ورقة */
    .card {
      background-color: #f7f1e4;
      background-image: url('parchment-bg.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 2px;
      padding: 18px 14px;
      margin-bottom: 14px;
      border: none;
      box-shadow: none;
      outline: none;
      position: relative;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .icon {
      font-size: 18px;
    }

    /* Goals */
    .goals-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .goal-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .goal-item input[type="checkbox"] {
      display: none;
    }

    .custom-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      background: white;
    }

    .goal-item input:checked + .custom-check {
      background: var(--gold);
      border-color: var(--gold-dark);
    }

    .goal-item input:checked + .custom-check::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .goal-line {
      flex: 1;
      border-bottom: 1.5px dotted #c9b896;
      height: 22px;
    }

    .goal-text-input {
      flex: 1;
      border: none;
      border-bottom: 1.5px dotted #c9b896;
      background: transparent;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .goal-text-input:focus {
      border-bottom-color: var(--gold);
    }

    /* Daily icons row */
    .daily-icons {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .daily-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 18%;
      min-width: 56px;
      margin-bottom: 8px;
    }

    .daily-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff9e8, #f5e6c8);
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .daily-item input:checked ~ .daily-icon,
    .daily-item.checked .daily-icon {
      background: var(--gold);
      color: white;
      transform: scale(1.05);
    }

    .daily-label {
      font-size: 12px;
      color: var(--brown);
      text-align: center;
    }

    .daily-item input {
      display: none;
    }

    /* Service row — شكل صليب كما في التصميم */
    .service-row {
      position: relative;
      width: 300px;
      height: 320px;
      margin: 12px auto 8px;
    }

    .service-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 90px;
      z-index: 2;
    }

    /* أعلى · يسار · يمين · أسفل */
    .service-item.pos-top { top: 0; left: 50%; transform: translateX(-50%); }
    .service-item.pos-left { top: 50%; left: 0; transform: translateY(-60%); }
    .service-item.pos-right { top: 50%; right: 0; transform: translateY(-60%); }
    .service-item.pos-bottom { bottom: 0; left: 50%; transform: translateX(-50%); }

    .service-cross-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      z-index: 1;
      pointer-events: none;
    }

    .service-cross-center img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(158,120,40,0.22));
    }

    .service-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2.5px solid #c9a227;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #fffef8;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(158,120,40,0.18);
    }

    .service-item.checked .service-circle {
      background: linear-gradient(145deg, #e8c96a, #c9a227);
      color: white;
      border-color: #a67c00;
    }

    .service-label {
      font-size: 12px;
      text-align: center;
      color: var(--brown);
      line-height: 1.3;
      font-weight: 600;
    }

    .count-badge {
      position: absolute;
      top: -4px;
      left: -4px;
      background: var(--gold-dark);
      color: white;
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    .helper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .helper-btn {
      background: #fff9e8;
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      font-family: inherit;
      font-size: 14px;
      color: var(--brown);
      cursor: pointer;
      line-height: 1.5;
    }

    .helper-btn:active { background: var(--gold); color: white; }

    .sin-cat {
      margin-bottom: 14px;
      background: #fff9e8;
      border: 1px solid rgba(201,162,39,0.35);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .sin-cat h4 {
      color: var(--gold-dark);
      margin-bottom: 8px;
      font-size: 15px;
    }

    .sin-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sin-chip {
      background: white;
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-family: inherit;
      color: var(--brown);
      cursor: pointer;
    }

    .sin-chip.selected {
      background: var(--gold);
      color: white;
      font-weight: 600;
    }

    .settings-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--card);
      border: 1.5px solid var(--gold);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mute-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(92,64,51,0.92);
      color: white;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 13px;
      z-index: 150;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: 90%;
    }

    .mute-banner.show { display: flex; }

    .mute-banner button {
      background: var(--gold);
      border: none;
      color: white;
      border-radius: 16px;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .guide-text {
      font-size: 14.5px;
      line-height: 1.9;
      text-align: right;
      color: var(--text);
    }

    .guide-text h3 {
      color: var(--brown);
      margin: 14px 0 8px;
      font-size: 16px;
    }

    /* Text areas */
    .text-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .text-box {
      background: rgba(255, 253, 248, 0.25);
      border: none;
      border-radius: 0;
      padding: 10px;
      min-height: 80px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
    }

    .text-box:active {
      border-color: var(--gold);
    }

    .text-box-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .text-preview {
      font-size: 13px;
      color: #8a7a60;
      line-height: 1.4;
      max-height: 50px;
      overflow: hidden;
      white-space: pre-wrap;
    }

    /* Psalms */
    .psalm-count {
      font-size: 13px;
      color: var(--gold-dark);
      margin-bottom: 10px;
    }

    .psalm-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .psalm-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .psalm-field label {
      font-size: 13px;
      color: var(--brown);
      min-width: 110px;
    }

    .psalm-field input {
      flex: 1;
      border: none;
      border-bottom: 1.5px solid #d4c4a0;
      background: transparent;
      padding: 6px 4px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .psalm-field input:focus {
      border-bottom-color: var(--gold);
    }

    /* Action buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .action-btn {
      background: linear-gradient(145deg, #c9a227, #a67c00);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(166, 124, 0, 0.3);
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* Bottom sections */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .bottom-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid rgba(201, 162, 39, 0.25);
      box-shadow: var(--shadow);
    }

    .bottom-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .bottom-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .mini-btn {
      background: #f5e6c8;
      border: 1px solid var(--gold);
      color: var(--brown);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mini-btn:active {
      background: var(--gold);
      color: white;
    }

    /* Verse footer */
    .verse-footer {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      font-size: 13px;
      color: var(--brown);
      line-height: 1.6;
      border-top: 1px solid rgba(201, 162, 39, 0.3);
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(62, 47, 28, 0.55);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: transparent !important;
      background-image: url('parchment-bg.jpg') !important;
      background-size: cover !important;
      background-position: center top;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      border-radius: 0 !important;
      padding: 20px;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      box-shadow: none !important;
      border: none !important;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--brown);
    }

    .modal-close {
      background: #f0e6d0;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--brown);
    }

    .modal textarea {
      width: 100%;
      min-height: 180px;
      border: 1.5px solid rgba(201, 162, 39, 0.4);
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      background: #fffdf8;
      color: var(--text);
    }

    .modal textarea:focus {
      border-color: var(--gold);
    }

    .save-btn {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(145deg, #c9a227, #a67c00);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Prayer content */
    .prayer-text {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text);
      text-align: center;
      padding: 10px 0;
      background: linear-gradient(180deg, rgba(245,230,200,0.4) 0%, rgba(255,253,248,0.9) 100%);
      border-radius: 12px;
      padding: 16px;
    }

    .prayer-text p {
      margin-bottom: 12px;
    }

    #prayerModal .modal-content {
      background: #fffdf8 url('jesus.jpg') no-repeat top center;
      background-size: cover;
    }

    #prayerModal .prayer-text {
      background: rgba(255, 253, 248, 0.88);
      text-align: right;
    }

    /* Psalm selector */
    .psalm-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .psalm-num {
      background: #f5e6c8;
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .psalm-num.selected {
      background: var(--gold);
      color: white;
      font-weight: 700;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--brown);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  
    .verse-line { cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: background .15s; }
    .verse-line:active { background: #f5e6c8; }
    .verse-line.hl-yellow { background: #fff3b0; }
    .verse-line.hl-green { background: #d4edda; }
    .verse-line.hl-blue { background: #d6eaf8; }
    .verse-line.hl-pink { background: #f8d7e8; }
    #modalTextarea.hl-yellow { background: #fff3b0; }
    #modalTextarea.hl-green { background: #d4edda; }
    #modalTextarea.hl-blue { background: #d6eaf8; }
    #modalTextarea.hl-pink { background: #f8d7e8; }
    .verse-menu {
      position: fixed; z-index: 4000; background: #fffdf8; border: 2px solid var(--gold);
      border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 8px 12px 12px;
      left: 10px; right: 10px;
      max-width: none; width: auto; max-height: 65vh; overflow-y: auto; text-align: right;
      -webkit-overflow-scrolling: touch;
    }
    .verse-menu button {
      display: block; width: 100%; text-align: right; padding: 10px 12px; margin: 4px 0;
      border: 1px solid #e8d9b5; border-radius: 10px; background: #fff; font-family: inherit;
      font-size: 14px; color: var(--brown); cursor: pointer;
    }
    .verse-menu button:active { background: #f5e6c8; }
    .align-btn { padding: 10px 16px; border-radius: 10px; border: 2px solid #d4c4a0; background: #fff; font-size: 18px; cursor: pointer; }
    .align-btn.active { border-color: var(--gold); background: #f5e6c8; }
    .font-opt { padding: 10px; border: 1px solid #e8d9b5; border-radius: 10px; margin: 4px 0; cursor: pointer; background: #fff; }
    .font-opt.active { border-color: var(--gold); background: #f5e6c8; }

  </style>
</head>
<body>
  <audio id="hymnAudio" src="hymn.m4a" preload="auto"></audio>
  <audio id="sawtRabina" src="sawt-rabina.mp3" preload="auto"></audio>
  <div id="verseMenu" class="verse-menu" style="display:none;"></div>
  <button class="settings-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>
  <div class="mute-banner" id="muteBanner">
    <span id="audioStatus">🎵 الترنيمة شغالة</span>
    <button onclick="toggleMute()">كتم / تشغيل</button>
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="logo.png" alt="خلوتي - توتة روحية">
      </div>

      <div class="date-nav">
        <button id="prevDay" aria-label="اليوم السابق">›</button>
        <div class="current-date" id="currentDate" onclick="openDatePicker()" style="cursor:pointer;" title="اضغط لاختيار تاريخ">الإثنين: ...</div>
        <button id="nextDay" aria-label="اليوم التالي">‹</button>
      </div>
      <input type="date" id="datePicker" style="display:none;" onchange="setDateFromPicker(this.value)">
    </div>

    <!-- أهدافى النهاردة -->
    <div class="card">
      <div class="card-title">
        <span class="icon">🍃</span> أهدافى اليوم
      </div>
      <div class="goals-list" id="goalsList">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- أنشطة اليوم (تفعيل) — أيقونات بدون ورقة -->
    <div class="card">
      <div class="card-title"><span class="icon">✓</span> أنشطة اليوم</div>
      <div class="daily-icons" id="dailyIcons"></div>
    </div>

    <!-- أقسام تفتح — أيقونات بدون ورقة -->
    <div class="card">
      <div class="card-title"><span class="icon">📂</span> أقسام الخلوة</div>
      <div class="daily-icons" id="openIcons"></div>
    </div>

    <!-- خدمة اليوم + صلوات — أيقونات بدون ورقة -->
    <div class="card">
      <div class="service-row" id="serviceRow">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- آية اليوم + تأملاتي -->
    <div class="card">
      <div class="text-section">
        <div class="text-box" onclick="openTextModal('verse')">
          <div class="text-box-title">🍃 آية اليوم</div>
          <div class="text-preview" id="versePreview">اضغط للكتابة...</div>
        </div>
        <div class="text-box" onclick="openTextModal('reflection')">
          <div class="text-box-title">🍃 تأملاتي اليوم</div>
          <div class="text-preview" id="reflectionPreview">اضغط للكتابة...</div>
        </div>
      </div>
    </div>

    <!-- مزاميري اليوم -->
    <div class="card">
      <div class="card-title" style="justify-content: space-between;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="icon">🎵</span> مزاميري اليوم
          <span class="psalm-count" id="psalmCount" style="font-weight:normal;">العدد: 0</span>
        </div>
        <button onclick="openPsalmSelector()" style="background:var(--gold); color:white; border:none; border-radius:20px; padding:6px 12px; font-size:12px; font-family:inherit; cursor:pointer;">
          ➕ اختيار
        </button>
      </div>
      <div id="selectedPsalmsHome" style="margin:8px 0 4px;font-size:13px;"></div>
      <div class="psalm-fields">
        <div class="psalm-field">
          <label>شكراً يارب على</label>
          <input type="text" id="psalmThanks" placeholder="...">
        </div>
        <div class="psalm-field">
          <label>عاوز أقولك يارب</label>
          <input type="text" id="psalmTell" placeholder="...">
        </div>
        <div class="psalm-field">
          <label>طلبة من أجل</label>
          <input type="text" id="psalmRequest" placeholder="...">
        </div>
      </div>
    </div>

    <div class="action-buttons" style="margin-top:10px;">
      <button class="action-btn" onclick="openSpokenPrayers()">صلوات مقروءة ومسموعة</button>
      <button class="action-btn" onclick="openTextModal('altar')">على المذبح</button>
    </div>
    <div class="action-buttons" style="margin-top:10px;">
      <button class="action-btn" onclick="openTextModal('likedReadings')">قراءات لمستني</button>
      <button class="action-btn" onclick="openPdfOptions()">تحميل PDF</button>
    </div>
    <div class="action-buttons" style="margin-top:10px;">
      <button class="action-btn" onclick="openSavedVerses()" style="background:linear-gradient(135deg,#c9a227,#a67c00);color:#fff;">📖 آياتي المحفوظة — اختاري للتصميم</button>
    </div>

    <!-- الآية -->
    <div class="verse-footer">
      «صلوا بلا انقطاع» ١ تسالونيكي ٥: ١٧
    </div>
  </div>

  <!-- Text Modal -->
  <div class="modal" id="textModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">تأملاتي اليوم</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <textarea id="modalTextarea" placeholder="اكتب هنا..."></textarea>
      <button class="save-btn" onclick="saveText()">حفظ</button>
      <button class="save-btn" onclick="printCurrentText()" style="margin-top:8px; background:#5a7d4a;">تحميل PDF</button>
      <button id="deleteTextBtn" onclick="deleteText()" style="display:none; width:100%; margin-top:10px; background:#c0392b; color:white; border:none; border-radius:25px; padding:12px; font-family:inherit; font-size:15px; cursor:pointer;">مسح النص</button>
    </div>
  </div>

  <!-- Prayer Modal -->
  <div class="modal" id="prayerModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="prayerTitle">صلاة</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="prayer-text" id="prayerContent"></div>
      <button class="save-btn" style="margin-top:10px; background:#5a7d4a;" onclick="printPrayer()">تحميل PDF للصلاة</button>
      <button class="save-btn" style="margin-top:10px; background:#5a7d4a;" onclick="printPrayer()">تحميل PDF للصلاة</button>
    </div>
  </div>

  <!-- Confession Helper Modal -->
  <div class="modal" id="confessionModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="confessionTitle">مساعد الاعتراف</div>
        <button class="modal-close" onclick="closeConfession()">×</button>
      </div>
      <div id="confessionBody"></div>
    </div>
  </div>

  <!-- Psalm Selector Modal -->
  <div class="modal" id="psalmModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">اختيار المزامير</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <p style="font-size:13px; color:#8a7a60; margin-bottom:8px;">اضغط للاختيار · اضغط مطوّلًا للقراءة — ترجمة فاندايك</p>
      <div id="selectedPsalmsBar" style="margin-bottom:10px;font-size:13px;"></div>
      <div class="psalm-grid" id="psalmGrid"></div>
      <button class="save-btn" style="background:#8a7a60;" onclick="closeModal()">تم</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // تحميل الكتاب عند الحاجة فقط (يقلل تهنيج البداية)
    window._bibleLoading = false;
    function ensureBibleLoaded(cb) {
      if (window.BIBLE_SVD && window.BIBLE_SVD.books) {
        if (cb) cb();
        return;
      }
      if (window._bibleLoading) {
        const t = setInterval(function() {
          if (window.BIBLE_SVD && window.BIBLE_SVD.books) {
            clearInterval(t);
            if (cb) cb();
          }
        }, 200);
        return;
      }
      window._bibleLoading = true;
      const s = document.createElement('script');
      s.src = 'bible-svd.js';
      s.async = true;
      s.onload = function() {
        window._bibleLoading = false;
        if (cb) cb();
      };
      s.onerror = function() {
        window._bibleLoading = false;
        if (typeof showToast === 'function') showToast('تعذر تحميل الكتاب المقدس');
      };
      document.head.appendChild(s);
    }

    // ============ State ============
    let currentDate = (function() {
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12, 0, 0, 0);
    })();
    let currentTextType = null;
    let selectedPsalms = [];

    const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    // مجموعة تفعيل فقط (ضغط = عملتها)
    const toggleItems = [
      { id: 'baker', label: 'باكر', icon: '☀️' },
      { id: 'sunset', label: 'غروب', icon: '🌅' },
      { id: 'sleep', label: 'نوم', icon: '🌙' },
      { id: 'mass', label: 'قداس', icon: '<img src="icon-mass.png" style="width:28px;height:28px;" alt="قداس">' },
      { id: 'praise', label: 'تسبيحة', icon: '🎵' },
      { id: 'fast', label: 'صوم', icon: '🌿' },
      { id: 'silence', label: 'ساعة صمت', icon: '🤫' },
      { id: 'service', label: 'خدمة اليوم', icon: '🙏' }
    ];

    // مجموعة تفتح للكتابة/المحتوى
    const openItems = [
      { id: 'oldTestament', label: 'العهد القديم', icon: '📜', type: 'bible' },
      { id: 'newTestament', label: 'العهد الجديد', icon: '📖', type: 'bible' },
      { id: 'agpeya', label: 'الأجبية', icon: '⛪', type: 'agpeya' },
      { id: 'howStart', label: 'كيف أبدأ خلوة', icon: '🚪', type: 'howto' },
      { id: 'fathers', label: 'آبائيات', icon: '🕯️', type: 'text' },
      { id: 'bibleComment', label: 'تفسير الكتاب', icon: '🔍', type: 'text' },
      { id: 'katameros', label: 'قطمارس', icon: '📅', type: 'text' },
      { id: 'faithExamples', label: 'تمثلوا بإيمانهم', icon: '⭐', type: 'text' },
      { id: 'prepare', label: 'تحضير', icon: '📝', type: 'text' },
      { id: 'spiritualReading', label: 'قراءات روحية', icon: '📚', type: 'books' },
      { id: 'saintsPraises', label: 'مدائح القديسين', icon: '🎶', type: 'text' },
      { id: 'servantFollow', label: 'متابعة الخادم', icon: '👥', type: 'servant' }
    ];

    const dailyItems = toggleItems; // توافق مع الكود القديم للعرض

    // ترتيب مطابق للتصميم: أعلى · يسار · يمين · أسفل
    const serviceItems = [
      { id: 'jesusPrayer', label: 'صلاة يسوع', icon: '📿' },
      { id: 'confession', label: 'مساعد الاعتراف', icon: '🕊️' },
      { id: 'kyrie', label: 'كيرياليسون', icon: '✝' },
      { id: 'progressChart', label: 'مستوى الخلوة', icon: '📊' }
    ];

    // ============ Helpers ============
    function getDateKey(date) {
      // تاريخ محلي عشان منتصف الليل ما ينقلش النشاط ليوم تاني
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function normalizeToLocalDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0);
    }

    function loadData() {
      const key = 'khalwati_' + getDateKey(currentDate);
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      return data;
    }

    function saveData(data) {
      const key = 'khalwati_' + getDateKey(currentDate);
      localStorage.setItem(key, JSON.stringify(data));
    }

    function updateDateDisplay() {
      const day = dayNames[currentDate.getDay()];
      const d = currentDate.getDate();
      const m = currentDate.getMonth() + 1;
      const y = currentDate.getFullYear();
      document.getElementById('currentDate').textContent = `${day}: ${y}/${m}/${d}`;
    }

    function openDatePicker() {
      const picker = document.getElementById('datePicker');
      picker.value = getDateKey(currentDate);
      picker.showPicker ? picker.showPicker() : picker.click();
    }

    function setDateFromPicker(val) {
      if (val) {
        currentDate = new Date(val + 'T12:00:00');
        renderAll();
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ============ Render ============
    function renderGoals() {
      const data = loadData();
      const list = document.getElementById('goalsList');
      list.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const checked = data['goal' + i] || false;
        const text = data['goalText' + i] || '';
        const from = data['goalFrom' + i] || '';
        const to = data['goalTo' + i] || '';
        list.innerHTML += `
          <div class="goal-item" style="flex-wrap:wrap;">
            <input type="checkbox" id="goal${i}" ${checked ? 'checked' : ''} onchange="toggleGoal(${i})">
            <label class="custom-check" for="goal${i}"></label>
            <input type="text" class="goal-text-input" id="goalText${i}" value="${text.replace(/"/g, '&quot;')}" placeholder="اكتب هدفك هنا..." oninput="saveGoalText(${i})">
            <div style="width:100%; display:flex; gap:8px; margin-top:4px; padding-right:32px; align-items:center; font-size:12px; color:var(--brown);">
              <span>من</span>
              <input type="time" id="goalFrom${i}" value="${from}" onchange="saveGoalTime(${i})" style="border:1px solid #d4c4a0; border-radius:8px; padding:4px; font-family:inherit; font-size:12px;">
              <span>إلى</span>
              <input type="time" id="goalTo${i}" value="${to}" onchange="saveGoalTime(${i})" style="border:1px solid #d4c4a0; border-radius:8px; padding:4px; font-family:inherit; font-size:12px;">
            </div>
          </div>
        `;
      }
    }

    function saveGoalText(num) {
      const data = loadData();
      data['goalText' + num] = document.getElementById('goalText' + num).value;
      saveData(data);
    }

    function saveGoalTime(num) {
      const data = loadData();
      data['goalFrom' + num] = document.getElementById('goalFrom' + num).value;
      data['goalTo' + num] = document.getElementById('goalTo' + num).value;
      saveData(data);
    }

    function renderDailyIcons() {
      const data = loadData();
      const container = document.getElementById('dailyIcons');
      container.innerHTML = '';
      toggleItems.forEach(item => {
        const checked = data[item.id] || false;
        container.innerHTML += `
          <div class="daily-item ${checked ? 'checked' : ''}" onclick="toggleDaily('${item.id}')">
            <input type="checkbox" id="${item.id}" ${checked ? 'checked' : ''}>
            <div class="daily-icon">${item.icon}</div>
            <div class="daily-label">${item.label}</div>
          </div>
        `;
      });
      const openContainer = document.getElementById('openIcons');
      if (openContainer) {
        openContainer.innerHTML = '';
        openItems.forEach(item => {
          openContainer.innerHTML += `
            <div class="daily-item" onclick="handleOpenItem('${item.id}', '${item.type}')">
              <div class="daily-icon">${item.icon}</div>
              <div class="daily-label">${item.label}</div>
            </div>
          `;
        });
      }
    }

    function handleOpenItem(id, type) {

    let bibleState = { testament: 'OT', bookIndex: 0, chapter: 0 };

    function openBible(testament) {
      bibleState.testament = testament || 'OT';
      document.getElementById('prayerTitle').textContent = 'الكتاب المقدس';
      document.getElementById('prayerContent').innerHTML = '<p style="text-align:center;padding:24px;">جاري تحميل الكتاب المقدس…</p>';
      document.getElementById('prayerModal').classList.add('active');
      ensureBibleLoaded(function() {
        const bible = window.BIBLE_SVD;
        if (!bible || !bible.books) {
          document.getElementById('prayerContent').innerHTML = '<p style="text-align:center;">تعذر تحميل الكتاب. تأكد من رفع bible-svd.js</p>';
          return;
        }
        const books = bible.books.filter(b => b.t === bibleState.testament);
        if (!books.length) return;
        const firstId = books[0].id;
        const fullIndex = bible.books.findIndex(b => b.id === firstId);
        bibleState.bookIndex = fullIndex >= 0 ? fullIndex : 0;
        bibleState.chapter = 0;
        renderBible();
      });
    }

    function renderBible() {
      const bible = window.BIBLE_SVD;
      if (!bible) return;
      const book = bible.books[bibleState.bookIndex];
      if (!book) return;
      const chCount = book.chapters.length;
      if (bibleState.chapter >= chCount) bibleState.chapter = 0;
      const verses = book.chapters[bibleState.chapter] || [];
      const booksSame = bible.books.filter(b => b.t === book.t);

      const bookOptions = booksSame.map(b => {
        const idx = bible.books.findIndex(x => x.id === b.id);
        return `<option value="${idx}" ${idx===bibleState.bookIndex?'selected':''}>${b.name}</option>`;
      }).join('');

      const chOptions = Array.from({length: chCount}, (_, i) =>
        `<option value="${i}" ${i===bibleState.chapter?'selected':''}>${i+1}</option>`
      ).join('');

      const versesHtml = verses.map((v, i) => {
        const ref = book.name + ' ' + (bibleState.chapter+1) + ':' + (i+1);
        const esc = String(v).replace(/'/g, "\\'");
        return `<p class="verse-line" data-ref="${ref}" data-text="${esc}" onclick="openVerseMenu(event, this)" style="margin:8px 0;line-height:1.9;"><span style="color:var(--gold-dark);font-weight:700;margin-left:6px;">${i+1}</span>${v}</p>`;
      }).join('');

      document.getElementById('prayerTitle').textContent = 'الكتاب المقدس — فاندايك';
      document.getElementById('prayerContent').innerHTML = `
        <div style="text-align:right;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <div style="width:100%;margin:8px 0;text-align:right;">
              <label style="font-size:12px;color:#8a7a60;">خط نص الكتاب (مستقل عن الصفحة الرئيسية)</label>
              <select id="bibleFontSelect" onchange="setBibleFont(this.value)" style="width:100%;padding:8px;margin-top:4px;font-family:inherit;">
                ${['Aref Ruqaa','Amiri','Cairo','Noto Naskh Arabic','Scheherazade New','Tajawal'].map(f => {
                  const cur = getBibleFont();
                  const lab = f==='Aref Ruqaa'?'✍ خط اليد':f;
                  return '<option value="'+f+'" '+(cur===f?'selected':'')+'>'+lab+'</option>';
                }).join('')}
              </select>
            </div>
            <button onclick="openBible('OT')" style="padding:6px 12px;border-radius:16px;border:1px solid var(--gold);background:${book.t==='OT'?'var(--gold)':'#fff'};color:${book.t==='OT'?'#fff':'var(--brown)'};font-family:inherit;">العهد القديم</button>
            <button onclick="openBible('NT')" style="padding:6px 12px;border-radius:16px;border:1px solid var(--gold);background:${book.t==='NT'?'var(--gold)':'#fff'};color:${book.t==='NT'?'#fff':'var(--brown)'};font-family:inherit;">العهد الجديد</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
            <select id="bibleBook" onchange="bibleState.bookIndex=parseInt(this.value);bibleState.chapter=0;renderBible();"
              style="flex:2;padding:8px;border-radius:10px;border:1px solid #d4c4a0;font-family:inherit;font-size:14px;">
              ${bookOptions}
            </select>
            <select id="bibleChapter" onchange="bibleState.chapter=parseInt(this.value);renderBible();"
              style="flex:1;padding:8px;border-radius:10px;border:1px solid #d4c4a0;font-family:inherit;font-size:14px;">
              ${chOptions}
            </select>
          </div>
          <h3 style="text-align:center;color:var(--brown);margin:8px 0 12px;">${book.name} — إصحاح ${bibleState.chapter+1}</h3>
          <div style="font-size:15px;">${versesHtml}</div>
          <div style="display:flex;gap:8px;margin-top:14px;">
            <button class="save-btn" style="flex:1;background:#8a7a60;" onclick="biblePrevChapter()">→ السابق</button>
            <button class="save-btn" style="flex:1;" onclick="bibleNextChapter()">التالي ←</button>
          </div>
        </div>`;
      document.getElementById('prayerModal').classList.add('active');
      const pc = document.getElementById('prayerContent');
      if (pc) pc.scrollTop = 0;
    }

    function biblePrevChapter() {
      if (bibleState.chapter > 0) {
        bibleState.chapter--;
      } else if (bibleState.bookIndex > 0) {
        const prev = window.BIBLE_SVD.books[bibleState.bookIndex - 1];
        if (prev && prev.t === window.BIBLE_SVD.books[bibleState.bookIndex].t) {
          bibleState.bookIndex--;
          bibleState.chapter = prev.chapters.length - 1;
        }
      }
      renderBible();
    }

    function bibleNextChapter() {
      const book = window.BIBLE_SVD.books[bibleState.bookIndex];
      if (bibleState.chapter < book.chapters.length - 1) {
        bibleState.chapter++;
      } else if (bibleState.bookIndex < window.BIBLE_SVD.books.length - 1) {
        const next = window.BIBLE_SVD.books[bibleState.bookIndex + 1];
        if (next && next.t === book.t) {
          bibleState.bookIndex++;
          bibleState.chapter = 0;
        }
      }
      renderBible();
    }

    function renderTexts() {
      const data = loadData();
      document.getElementById('versePreview').textContent = data.verse || 'اضغط للكتابة...';
      document.getElementById('reflectionPreview').textContent = data.reflection || 'اضغط للكتابة...';
    }

    function renderPsalms() {
      const data = loadData();
      selectedPsalms = data.selectedPsalms || [];
      document.getElementById('psalmCount').textContent = `العدد: ${selectedPsalms.length}`;
      document.getElementById('psalmThanks').value = data.psalmThanks || '';
      document.getElementById('psalmTell').value = data.psalmTell || '';
      document.getElementById('psalmRequest').value = data.psalmRequest || '';
      const home = document.getElementById('selectedPsalmsHome');
      if (home) {
        if (!selectedPsalms.length) {
          home.innerHTML = '';
        } else {
          home.innerHTML = selectedPsalms.map(n =>
            `<button onclick="readPsalm(${n})" style="margin:2px;padding:4px 10px;border-radius:14px;border:1px solid var(--gold);background:#fff9e8;font-family:inherit;font-size:12px;cursor:pointer;">مزمور ${n} 📖</button>`
          ).join('');
        }
      }
    }

    function renderAll() {
      updateDateDisplay();
      renderGoals();
      renderDailyIcons();
      renderServices();
      renderTexts();
      renderPsalms();
    }

    // ============ Actions ============
    function toggleGoal(num) {
      const data = loadData();
      data['goal' + num] = document.getElementById('goal' + num).checked;
      saveData(data);
    }

    function toggleDaily(id) {
      const data = loadData();
      data[id] = !data[id];
      saveData(data);
      renderDailyIcons();
    }

    function handleDailyClick(id) {
      const openers = {
        fathers: 'fathers',
        bibleComment: 'bibleComment',
        katameros: 'katameros',
        faithExamples: 'faithExamples'
      };
      if (openers[id]) {
        toggleDaily(id);
        openTextModal(openers[id]);
        return;
      }
      toggleDaily(id);
    }

    function toggleService(id) {
      const data = loadData();
      data[id] = !data[id];
      saveData(data);
      renderServices();
    }

    // Text modal
    function openTextModal(type) {
      currentTextType = type;
      const data = loadData();
      const titles = {
        verse: 'آية اليوم',
        reflection: 'تأملاتي اليوم',
        confession: 'الاعتراف',
        altar: 'على المذبح',
        likedReadings: 'قراءات لمستني',
        fathers: 'آبائيات',
        bibleComment: 'تفسير الكتاب المقدس',
        katameros: 'قطمارس',
        faithExamples: 'تمثلوا بإيمانهم',
        prepare: 'تحضير',
        howStart: 'كيف أبدأ خلوة',
        saintsPraises: 'مدائح القديسين',
        oldTestament: 'العهد القديم',
        newTestament: 'العهد الجديد',
        spiritualReading: 'قراءات روحية'
      };
      document.getElementById('modalTitle').textContent = titles[type] || type;
      let val = data[type];
      if (type === 'confession' && typeof val !== 'string') val = '';
      document.getElementById('modalTextarea').value = val || '';
      const delBtn = document.getElementById('deleteTextBtn');
      if (delBtn) delBtn.style.display = (type === 'confession' || type === 'altar' || type === 'likedReadings') ? 'block' : 'none';
      // أدوات التمييز والتصميم لآية اليوم / التأمل / القراءات
      let tools = document.getElementById('textModalTools');
      if (!tools) {
        tools = document.createElement('div');
        tools.id = 'textModalTools';
        const ta = document.getElementById('modalTextarea');
        if (ta && ta.parentNode) ta.parentNode.insertBefore(tools, ta);
      }
      const allowTools = (type === 'verse' || type === 'reflection' || type === 'likedReadings');
      if (allowTools) {
        const hlKey = 'khalwati_text_hl_' + type + '_' + getDateKey(currentDate);
        const savedHl = localStorage.getItem(hlKey) || '';
        const ta = document.getElementById('modalTextarea');
        if (ta) {
          ta.classList.remove('hl-yellow','hl-green','hl-blue','hl-pink');
          if (savedHl) ta.classList.add('hl-' + savedHl);
        }
        tools.style.display = 'block';
        tools.innerHTML = `
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:flex-end;">
            <button type="button" class="align-btn" title="أصفر" onclick="highlightTextModal('yellow')">🟡</button>
            <button type="button" class="align-btn" title="أخضر" onclick="highlightTextModal('green')">🟢</button>
            <button type="button" class="align-btn" title="أزرق" onclick="highlightTextModal('blue')">🔵</button>
            <button type="button" class="align-btn" title="وردي" onclick="highlightTextModal('pink')">🩷</button>
            <button type="button" class="align-btn" onclick="highlightTextModal('clear')">✕</button>
            <button type="button" class="save-btn" style="padding:8px 12px;margin:0;" onclick="openVerseDesign(document.getElementById('modalTextarea').value, document.getElementById('modalTitle').textContent)">🎨 تصميم وحفظ</button>
          </div>`;
      } else {
        tools.style.display = 'none';
        tools.innerHTML = '';
      }
      document.getElementById('textModal').classList.add('active');
    }

    function highlightTextModal(color) {
      const ta = document.getElementById('modalTextarea');
      if (!ta || !currentTextType) return;
      const hlKey = 'khalwati_text_hl_' + currentTextType + '_' + getDateKey(currentDate);
      ta.classList.remove('hl-yellow','hl-green','hl-blue','hl-pink');
      if (color === 'clear') {
        localStorage.removeItem(hlKey);
        showToast('تم إزالة التمييز');
        return;
      }
      ta.classList.add('hl-' + color);
      localStorage.setItem(hlKey, color);
      showToast('تم التمييز — سيبقى حتى تزيله');
    }

    function saveText() {
      const data = loadData();
      const textVal = document.getElementById('modalTextarea').value;
      data[currentTextType] = textVal;
      if (currentTextType === 'confession') {
        data.confessionDone = !!(textVal && textVal.trim());
      }
      if (currentTextType === 'likedReadings' && textVal) {
        const monthKey = 'readings_' + currentDate.getFullYear() + '-' + String(currentDate.getMonth()+1).padStart(2,'0');
        const monthNotes = JSON.parse(localStorage.getItem('khalwati_' + monthKey) || '[]');
        monthNotes.push({ day: getDateKey(currentDate), text: textVal });
        localStorage.setItem('khalwati_' + monthKey, JSON.stringify(monthNotes));
      }
      saveData(data);
      renderTexts();
      renderServices();
      closeModal();
      showToast('تم الحفظ ✓');
    }

    function deleteText() {
      if (!confirm('هل تريد مسح النص؟')) return;
      const data = loadData();
      data[currentTextType] = '';
      if (currentTextType === 'confession') data.confessionDone = false;
      saveData(data);
      document.getElementById('modalTextarea').value = '';
      renderServices();
      closeModal();
      showToast('تم المسح');
    }

    function changePrayerCount(type, delta) {
      const data = loadData();
      const countKey = type + 'Count';
      let count = (data[countKey] || 0) + delta;
      if (count < 0) count = 0;
      data[countKey] = count;
      saveData(data);
      const display = document.getElementById('prayerCountDisplay');
      if (display) display.textContent = count;

      // Also mark the service checkbox if count > 0
      if (type === 'jesus') {
        data.jesusPrayer = count > 0;
      } else {
        data.kyrie = count > 0;
      }
      saveData(data);
      renderServices();
    }

    // Psalm selector + reader (من ملف دير أنبا مقار — النص القبطي / السبعينية)
    // تقدير تقريبي لصفحة بداية كل مزمور في الـ PDF
    function psalmPdfPage(num) {
      return Math.max(3, Math.min(315, 2 + Math.round(num * 2.05)));
    }

    function openMazameerPdf(page) {
      const url = page ? ('mazameer.pdf#page=' + page) : 'mazameer.pdf';
      window.open(url, '_blank');
    }

    function openPsalmSelector() {
      const grid = document.getElementById('psalmGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 150; i++) {
        const selected = selectedPsalms.includes(i);
        grid.innerHTML += `
          <div class="psalm-num ${selected ? 'selected' : ''}"
               data-num="${i}"
               onclick="togglePsalm(${i})"
               oncontextmenu="event.preventDefault(); readPsalm(${i}); return false;">${i}</div>
        `;
      }
      // long-press support
      let pressTimer = null;
      grid.querySelectorAll('.psalm-num').forEach(el => {
        el.addEventListener('touchstart', function(e) {
          const n = parseInt(this.getAttribute('data-num'));
          pressTimer = setTimeout(() => { readPsalm(n); }, 550);
        }, { passive: true });
        el.addEventListener('touchend', function() { clearTimeout(pressTimer); });
        el.addEventListener('touchmove', function() { clearTimeout(pressTimer); });
      });
      renderSelectedPsalmsBar();
      document.getElementById('psalmModal').classList.add('active');
    }

    function renderSelectedPsalmsBar() {
      const bar = document.getElementById('selectedPsalmsBar');
      if (!bar) return;
      if (!selectedPsalms.length) {
        bar.innerHTML = '<span style="color:#8a7a60;">لم يتم اختيار مزامير بعد</span>';
        return;
      }
      bar.innerHTML = '<strong>المختارة:</strong> ' + selectedPsalms.map(n =>
        `<button onclick="readPsalm(${n})" style="margin:2px;padding:4px 8px;border-radius:12px;border:1px solid var(--gold);background:#fff9e8;font-family:inherit;font-size:12px;cursor:pointer;">${n} 📖</button>`
      ).join(' ');
    }

    function togglePsalm(num) {
      const idx = selectedPsalms.indexOf(num);
      if (idx > -1) {
        selectedPsalms.splice(idx, 1);
      } else {
        selectedPsalms.push(num);
      }
      selectedPsalms.sort((a, b) => a - b);
      const data = loadData();
      data.selectedPsalms = selectedPsalms;
      saveData(data);
      document.getElementById('psalmCount').textContent = `العدد: ${selectedPsalms.length}`;
      const els = document.querySelectorAll('.psalm-num');
      els.forEach(el => {
        const n = parseInt(el.getAttribute('data-num') || el.textContent);
        el.classList.toggle('selected', selectedPsalms.includes(n));
      });
      renderSelectedPsalmsBar();
    }

    function getVanDyckPsalmsBook() {
      const bible = window.BIBLE_SVD;
      if (!bible || !bible.books) return null;
      return bible.books.find(b => b.id === 19 || b.code === 'Ps' || b.name === 'المزامير') || null;
    }

    function readPsalm(num) {
      num = parseInt(num, 10);
      const book = getVanDyckPsalmsBook();
      let bodyHtml = '';
      if (book && num >= 1 && num <= book.chapters.length) {
        const verses = book.chapters[num - 1] || [];
        bodyHtml = `<h3 style="text-align:center;margin:8px 0 12px;color:var(--brown);">المزمور ${num}</h3>` +
          verses.map((v, i) => {
            const ref = 'المزمور ' + num + ':' + (i+1);
            const esc = String(v).replace(/'/g, "\\'");
            return `<p class="verse-line" data-ref="${ref}" data-text="${esc}" onclick="openVerseMenu(event, this)" style="margin:8px 0;line-height:1.95;"><span style="color:var(--gold-dark);font-weight:700;margin-left:6px;">${i + 1}</span>${v}</p>`;
          }).join('');
      } else {
        bodyHtml = `<p style="text-align:center;color:#8a7a60;">النص غير متوفر لهذا المزمور حاليًا.</p>`;
      }
      const maxPs = book ? book.chapters.length : 150;
      document.getElementById('prayerTitle').textContent = 'المزمور ' + num;
      document.getElementById('prayerContent').innerHTML = `
        <div style="text-align:right;line-height:1.95;font-size:15px;">
          <p style="text-align:center;color:var(--gold-dark);font-weight:600;font-size:13px;">ترجمة فاندايك</p>
          <div style="margin-top:10px;">${bodyHtml}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center;">
            ${num > 1 ? `<button class="save-btn" style="background:#8a7a60;flex:1;" onclick="readPsalm(${num - 1})">→ السابق</button>` : ''}
            ${num < maxPs ? `<button class="save-btn" style="flex:1;" onclick="readPsalm(${num + 1})">التالي ←</button>` : ''}
          </div>
          <button class="save-btn" style="margin-top:8px;background:#5a7d4a;" onclick="openPsalmSelector()">رجوع لاختيار المزامير</button>
        </div>`;
      document.getElementById('psalmModal').classList.remove('active');
      document.getElementById('prayerModal').classList.add('active');
      const pc = document.getElementById('prayerContent');
      if (pc) pc.scrollTop = 0;
      applyStoredHighlights(document.getElementById('prayerContent'));
      applyBibleFontToContent(document.getElementById('prayerContent'));
    }

        <link rel="stylesheet" href="${fontLink}">
        <style>
          @import url('${fontLink}');

          p,div,li{font-size:${st.size}px;font-weight:400;font-family:inherit;}

          img{max-width:90px;border-radius:50%;}

    function autoSyncSinsToConfession() {
      const data = loadData();
      const dateLabel = getTodayDateLabel();
      const marker = '—— اعتراف بتاريخ ' + dateLabel + ' ——';
      let base = '';
      if (typeof data.confession === 'string') {
        // احذف بلوك تاريخ اليوم القديم لو موجود
        const parts = data.confession.split(/\n*—— اعتراف بتاريخ /);
        base = (parts[0] || '').trim();
        // أعد أي بلوكات تواريخ تانية
        for (let i = 1; i < parts.length; i++) {
          const block = '—— اعتراف بتاريخ ' + parts[i];
          if (!block.startsWith(marker)) {
            base = base ? (base + '\n\n' + block.trim()) : block.trim();
          }
        }
      }
      if (selectedSins.length) {
        const sinsBlock = marker + '\n' + selectedSins.map(s => '• ' + s).join('\n');
        data.confession = base ? (base + '\n\n' + sinsBlock) : sinsBlock;
        data.confessionDone = true;
      } else {
        data.confession = base;
        data.confessionDone = !!(base && base.trim());
      }
      saveData(data);
      renderServices();
    }

    function copySinsToConfession() {
      if (!selectedSins.length) {
        showToast('اختاري خطايا أولاً');

      autoSyncSinsToConfession();

    }

    function playHymn() {
      const audio = document.getElementById('hymnAudio');
      const banner = document.getElementById('muteBanner');
      if (!audio) return;
      const sawt = document.getElementById('sawtRabina');
      if (sawt) { try { sawt.pause(); sawt.currentTime = 0; } catch(e) {} }

      function onHymnReallyEnded() {
        if (banner) banner.classList.remove('show');
        armJesusVoiceTwoMinutesAfterHymn();
      }

      if (isMuted()) {
        audio.pause();
        if (banner) banner.classList.remove('show');
        // لو الصوت مكتوم: اعتبر الترنيمة انتهت وابدأ عدّاد دقيقتين
        armJesusVoiceTwoMinutesAfterHymn();
        return;
      }
      try { audio.currentTime = 0; } catch(e) {}
      const p = audio.play();
      if (p && p.catch) p.catch(function() {
        showToast('اضغطي أي مكان لتشغيل الترنيمة');
      });
      if (banner) {
        banner.classList.add('show');
        const st = document.getElementById('audioStatus');
        if (st) st.textContent = '🎵 الترنيمة شغالة';
      }
      audio.onended = onHymnReallyEnded;
      // احتياطي لو onended ما اشتغلش على بعض الموبايلات
      if (window._hymnEndPoll) clearInterval(window._hymnEndPoll);
      window._hymnEndPoll = setInterval(function() {
        if (!audio) return;
        if (audio.ended || (audio.duration > 0 && audio.currentTime >= audio.duration - 0.4)) {
          clearInterval(window._hymnEndPoll);
          window._hymnEndPoll = null;
          onHymnReallyEnded();
        }
      }, 1000);
    }

    function armJesusVoiceTwoMinutesAfterHymn() {
      const todayKey = getDateKey(new Date());

    function injectFontFace(name) {
      const id = 'ff-inject-' + String(name).replace(/\s+/g, '-');
      if (document.getElementById(id)) return Promise.resolve();
      const files = FONT_FILE_URLS[name];
      // أيضًا رابط CSS الرسمي
      const linkId = 'gf-css-' + String(name).replace(/\s+/g, '-');
      if (!document.getElementById(linkId)) {
        const q = String(name).replace(/ /g, '+') + ':wght@400;700';
        const link = document.createElement('link');
        link.id = linkId;
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + q + '&display=swap';
        document.head.appendChild(link);
      }
      if (files) {
        const st = document.createElement('style');
        st.id = id;
        const fmt400 = files[400].indexOf('.woff2') >= 0 ? 'woff2' : 'truetype';
        const fmt700 = files[700].indexOf('.woff2') >= 0 ? 'woff2' : 'truetype';
        st.textContent =
          "@font-face{font-family:'" + name + "';font-style:normal;font-weight:400;font-display:swap;src:url('" + files[400] + "') format('" + fmt400 + "');}" +
          "@font-face{font-family:'" + name + "';font-style:normal;font-weight:700;font-display:swap;src:url('" + files[700] + "') format('" + fmt700 + "');}";
        document.head.appendChild(st);
      }
      if (document.fonts && document.fonts.load) {
        return document.fonts.load('16px "' + name + '"').catch(function(){ return null; });
      }
      return new Promise(function(res){ setTimeout(res, 400); });
    }

      const rect = el.getBoundingClientRect();

      if (verseMid > vh * 0.45) {

        menu.style.top = '12px';
        menu.style.bottom = 'auto';
      } else {
        // الآية في النصف العلوي → القائمة من أسفل الشاشة
        menu.style.top = 'auto';

      enableVerseMenuDrag(menu);
    }

    function enableVerseMenuDrag(menu) {
      const handle = document.getElementById('verseMenuDrag');
      if (!handle || !menu) return;
      let startY = 0, startTop = 0, dragging = false;
      function getTop() {
        const t = menu.style.top;
        if (t && t !== 'auto') return parseFloat(t) || 12;
        // لو مثبتة من تحت، حولّي لإحداثي top
        const r = menu.getBoundingClientRect();
        return r.top;
      }
      function onStart(e) {
        dragging = true;
        const t = e.touches ? e.touches[0] : e;
        startY = t.clientY;
        startTop = getTop();
        menu.style.bottom = 'auto';
        menu.style.top = startTop + 'px';
        handle.style.cursor = 'grabbing';
        e.preventDefault();
      }
      function onMove(e) {
        if (!dragging) return;
        const t = e.touches ? e.touches[0] : e;
        const dy = t.clientY - startY;
        let next = startTop + dy;
        const maxTop = (window.innerHeight || 600) - 120;
        if (next < 8) next = 8;
        if (next > maxTop) next = maxTop;
        menu.style.top = next + 'px';
        menu.style.bottom = 'auto';
        e.preventDefault();
      }
      function onEnd() {
        dragging = false;
        handle.style.cursor = 'grab';
      }
      handle.onmousedown = onStart;
      handle.ontouchstart = onStart;
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchend', onEnd);
    }

    function openSavedVerses() {
      const list = JSON.parse(localStorage.getItem('khalwati_saved_verses') || '[]');
      document.getElementById('prayerTitle').textContent = 'آياتي المحفوظة';
      if (!list.length) {
        document.getElementById('prayerContent').innerHTML = `
          <div style="text-align:center;padding:20px;line-height:1.9;">
            <p style="color:#8a7a60;">لا توجد آيات محفوظة بعد.</p>
            <p style="font-size:13px;color:#8a7a60;">افتحي الكتاب أو المزامير → اضغطي على آية → «حفظ الآية»</p>
          </div>`;
        document.getElementById('prayerModal').classList.add('active');
        return;
      }
      const items = list.map((v, i) => {
        const ref = (v.ref || 'آية').replace(/</g, '&lt;');
        const snippet = String(v.text || '').replace(/</g, '&lt;').slice(0, 100);
        return `
          <div style="border:1px solid #e8d9b5;border-radius:14px;padding:12px;margin-bottom:10px;background:#fffdf8;text-align:right;">
            <p style="font-weight:700;color:var(--brown);margin-bottom:6px;">${ref}</p>
            <p style="font-size:13px;line-height:1.7;color:#5c4033;margin-bottom:10px;">${snippet}${(v.text||'').length>100?'…':''}</p>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <button class="save-btn" style="flex:1;padding:8px;margin:0;" onclick="designSavedVerse(${i})">🎨 تصميم</button>
              <button class="save-btn" style="flex:1;padding:8px;margin:0;background:#5a7d4a;" onclick="useSavedAsToday(${i})">آية اليوم</button>
              <button class="save-btn" style="padding:8px 12px;margin:0;background:#8a7a60;" onclick="deleteSavedVerse(${i})">حذف</button>
            </div>
          </div>`;
      }).join('');
      document.getElementById('prayerContent').innerHTML = `
        <div style="text-align:right;">
          <p style="font-size:13px;color:#8a7a60;margin-bottom:12px;">اختاري آية لتصميمها أو جعلها آية اليوم (${list.length} محفوظة)</p>
          ${items}
        </div>`;
      document.getElementById('prayerModal').classList.add('active');
    }

    function designSavedVerse(index) {
      const list = JSON.parse(localStorage.getItem('khalwati_saved_verses') || '[]');
      const v = list[index];
      if (!v) { showToast('الآية غير موجودة'); return; }
      openVerseDesign(v.text || '', v.ref || 'آية محفوظة');
    }

    function useSavedAsToday(index) {
      const list = JSON.parse(localStorage.getItem('khalwati_saved_verses') || '[]');
      const v = list[index];
      if (!v) return;
      const data = loadData();
      data.verse = ((v.ref ? v.ref + '\\n' : '') + (v.text || '')).trim();
      saveData(data);
      if (typeof renderTexts === 'function') renderTexts();
      showToast('تم تعيينها كآية اليوم ✓');
    }

    function deleteSavedVerse(index) {
      if (!confirm('حذف هذه الآية من المحفوظات؟')) return;
      const list = JSON.parse(localStorage.getItem('khalwati_saved_verses') || '[]');
      list.splice(index, 1);
      localStorage.setItem('khalwati_saved_verses', JSON.stringify(list));
      openSavedVerses();
      showToast('تم الحذف');
    }

    function openVerseDesign(customText, customRef) {
      let ref = customRef || '';
      let txt = customText || '';
      if (!txt) {
        const el = document.querySelector('.verse-line.active-verse');
        if (el) {
          ref = el.getAttribute('data-ref') || '';
          txt = el.getAttribute('data-text') || el.innerText || '';
        }
      }
      if (!txt) {
        const ta = document.getElementById('modalTextarea');
        if (ta && ta.value.trim()) {
          txt = ta.value.trim();
          ref = (document.getElementById('modalTitle') || {}).textContent || '';
        }
      }
      if (!txt) { showToast('لا يوجد نص للتصميم'); return; }
      closeVerseMenu();
      const len = (txt || '').length;
      let autoSize = 20;
      if (len > 80) autoSize = 18;
      if (len > 150) autoSize = 16;
      if (len > 280) autoSize = 15;
      if (len > 450) autoSize = 14;
      if (len > 700) autoSize = 13;
      window._designState = {
        text: txt,
        ref: ref,
        bg: 1,
        font: localStorage.getItem('khalwati_design_font') || localStorage.getItem('khalwati_font') || 'Cairo',
        size: autoSize,
        color: '#3e2f1c',
        align: 'center',
        autoFit: true,
        posX: 50,
        posY: 42
      };
      renderVerseDesignUI();
      document.getElementById('prayerModal').classList.add('active');
    }

    function renderVerseDesignUI() {

      let bgs = '';

      const bgUrl = VERSE_BACKGROUNDS[st.bg] || VERSE_BACKGROUNDS[1];
      document.getElementById('prayerTitle').textContent = 'تصميم الآية / التأمل';
      document.getElementById('prayerContent').innerHTML = `
        <div style="text-align:center;">
          <div id="verseDesignPreview" style="position:relative;width:100%;max-width:340px;margin:0 auto;border-radius:16px;overflow:hidden;min-height:360px;height:360px;background:url(${bgUrl}) center/cover;touch-action:none;">
            <div id="verseDesignText" style="position:absolute;left:${st.posX||50}%;top:${st.posY||42}%;transform:translate(-50%,-50%);width:86%;padding:12px;color:${st.color};text-align:${st.align};font-family:'${st.font}',serif;font-size:${st.size}px;text-shadow:0 1px 2px rgba(255,255,255,.75);cursor:move;user-select:none;">
              <p style="font-size:${Math.max(12, st.size-4)}px;font-weight:700;margin-bottom:8px;">${(st.ref||'').replace(/</g,'&lt;')}</p>
              <p style="line-height:1.85;white-space:pre-wrap;">${(st.text||'').replace(/</g,'&lt;')}</p>
              <p style="margin-top:12px;font-size:12px;opacity:.75;">خلوتي ✝</p>
            </div>
          </div>
          <p style="font-size:12px;color:#8a7a60;margin:8px 0 4px;">👆 اسحبي النص لوضعه في المكان المناسب</p>
          <p style="margin:8px 0 6px;font-size:13px;">الخلفية:</p>
          <div style="display:flex;flex-wrap:wrap;justify-content:center;">${bgs}</div>
          <div style="text-align:right;margin-top:12px;font-size:13px;">
            <label>الخط</label>
            <select id="designFont" onchange="updateDesignStyle()" style="width:100%;padding:8px;margin:4px 0;font-family:inherit;">${fontOpts}</select>

            <label>المحاذاة</label>

              <button type="button" class="align-btn" onclick="window._designState.align='right';updateDesignStyle();">يمين</button>
              <button type="button" class="align-btn" onclick="window._designState.align='center';updateDesignStyle();">منتصف</button>
              <button type="button" class="align-btn" onclick="window._designState.align='left';updateDesignStyle();">يسار</button>
            </div>
          </div>
          <button class="save-btn" style="margin-top:12px;" onclick="saveDesignToDevice(false)">💾 حفظ الصورة على الموبايل</button>
        </div>`;
      enableDesignTextDrag();

    function enableDesignTextDrag() {
      const box = document.getElementById('verseDesignText');
      const stage = document.getElementById('verseDesignPreview');
      if (!box || !stage || !window._designState) return;
      let dragging = false;
      function pctFromEvent(clientX, clientY) {
        const r = stage.getBoundingClientRect();
        let x = ((clientX - r.left) / r.width) * 100;
        let y = ((clientY - r.top) / r.height) * 100;
        x = Math.max(12, Math.min(88, x));
        y = Math.max(12, Math.min(88, y));
        return { x: x, y: y };
      }
      function applyPos(x, y) {
        window._designState.posX = x;
        window._designState.posY = y;
        box.style.left = x + '%';
        box.style.top = y + '%';
      }
      function onStart(e) {
        dragging = true;
        const t = e.touches ? e.touches[0] : e;
        const p = pctFromEvent(t.clientX, t.clientY);
        applyPos(p.x, p.y);
        e.preventDefault();
      }
      function onMove(e) {
        if (!dragging) return;
        const t = e.touches ? e.touches[0] : e;
        const p = pctFromEvent(t.clientX, t.clientY);
        applyPos(p.x, p.y);
        e.preventDefault();
      }
      function onEnd() { dragging = false; }
      box.onmousedown = onStart;
      box.ontouchstart = onStart;
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('mouseup', onEnd);
      window.addEventListener('touchend', onEnd);
      // also drag on stage empty area
      stage.onmousedown = function(e) {
        if (e.target === stage) onStart(e);
      };
      stage.ontouchstart = function(e) {

    function saveDesignToDevice(silent) {
      const st = window._designState;
      if (!st) { showToast('افتحي التصميم أولاً'); return; }
      const bgSrc = VERSE_BACKGROUNDS[st.bg] || VERSE_BACKGROUNDS[1];
      if (!bgSrc) { showToast('الخلفية غير متاحة'); return; }

      const W = 1080, H = 1350;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      // data URI — no CORS issue
      img.onload = function() {
        // cover background
        const scale = Math.max(W / img.width, H / img.height);
        const nw = img.width * scale, nh = img.height * scale;
        ctx.drawImage(img, (W - nw) / 2, (H - nh) / 2, nw, nh);
        // soft center panel for readability
        ctx.fillStyle = 'rgba(255,253,248,0.18)';
        ctx.fillRect(0, 0, W, H);

        const fontName = st.font || 'Cairo';
        const color = st.color || '#3e2f1c';
        const align = st.align || 'center';
        const maxW = W * 0.78;
        const targetH = H * 0.42; // text should fill ~42% of height
        const fullText = ((st.ref ? st.ref + '\n\n' : '') + (st.text || '')).trim();
        const footer = 'خلوتي ✝';

        // binary search best font size so text fits target box and is as large as possible
        let lo = 28, hi = 72, best = 36;
        function measure(size) {
          ctx.font = size + 'px ' + fontName;
          const lines = layoutLines(ctx, fullText, maxW);
          const lineH = size * 1.45;
          return lines.length * lineH;
        }
        for (let i = 0; i < 14; i++) {
          const mid = (lo + hi) / 2;
          if (measure(mid) <= targetH) { best = mid; lo = mid; }
          else hi = mid;
        }
        // if user manually set size and disabled auto — still prefer fit if overflow
        let bodySize = best;
        if (st.autoFit === false && st.size) {
          bodySize = Math.min(st.size * 2.2, best); // canvas is larger than screen preview
        }
        bodySize = Math.max(30, Math.min(70, bodySize));

        const lines = layoutLines(ctx, fullText, maxW, bodySize + 'px ' + fontName);
        const lineH = bodySize * 1.45;
        const blockH = lines.length * lineH;
        // موضع من السحب (نسبة مئوية)
        const posX = (typeof st.posX === 'number') ? st.posX : 50;
        const posY = (typeof st.posY === 'number') ? st.posY : 42;
        let y = (posY / 100) * H - blockH / 2;
        if (y < 40) y = 40;
        if (y + blockH > H - 90) y = H - 90 - blockH;

        ctx.fillStyle = color;
        ctx.textAlign = align === 'left' ? 'left' : (align === 'right' ? 'right' : 'center');
        let x;
        if (align === 'left') x = (posX / 100) * W - maxW / 2;
        else if (align === 'right') x = (posX / 100) * W + maxW / 2;
        else x = (posX / 100) * W;
        if (align === 'center') {
          /* x is center */
        } else {
          if (x < 40) x = 40;
          if (x > W - 40) x = W - 40;
        }
        ctx.font = '600 ' + bodySize + 'px ' + fontName;
        // subtle text shadow for readability
        ctx.shadowColor = 'rgba(255,255,255,0.7)';
        ctx.shadowBlur = 4;
        lines.forEach((line, idx) => {
          ctx.fillText(line, x, y + idx * lineH);
        });
        ctx.shadowBlur = 0;
        ctx.font = '28px ' + fontName;
        ctx.textAlign = 'center';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.85;
        ctx.fillText(footer, W / 2, H - 70);
        ctx.globalAlpha = 1;

        canvas.toBlob(function(blob) {
          if (!blob) { showToast('تعذر إنشاء الصورة'); return; }
          const file = new File([blob], 'khalwati-design-' + Date.now() + '.jpg', { type: 'image/jpeg' });
          // على الموبايل: مشاركة/حفظ أوضح
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'خلوتي' }).then(function() {
              if (!silent) showToast('تم حفظ / مشاركة التصميم ✓');
            }).catch(function() {
              downloadBlob(blob, file.name);
              if (!silent) showToast('تم تنزيل التصميم ✓');
            });
          } else {
            downloadBlob(blob, file.name);
            if (!silent) showToast('تم تنزيل التصميم ✓');
          }
          try {
            const list = JSON.parse(localStorage.getItem('khalwati_designs') || '[]');
            list.unshift({ ref: st.ref, text: st.text, bg: st.bg, date: new Date().toISOString() });
            localStorage.setItem('khalwati_designs', JSON.stringify(list.slice(0, 50)));
          } catch (e) {}
        }, 'image/jpeg', 0.92);
      };
      img.onerror = function() { showToast('تعذر تحميل الخلفية للحفظ'); };
      img.src = bgSrc;
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name || 'khalwati-design.jpg';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 1500);
    }

    function layoutLines(ctx, text, maxWidth, fontSpec) {
      if (fontSpec) ctx.font = fontSpec;
      const lines = [];
      String(text || '').split('\n').forEach(function(para) {
        if (!para.trim()) { lines.push(''); return; }
        const words = para.split(/\s+/);
        let line = '';
        words.forEach(function(word) {
          const test = line ? line + ' ' + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
          } else line = test;
        });
        if (line) lines.push(line);
      });
      return lines;
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const lines = layoutLines(ctx, text, maxWidth);
      let yy = y;
      lines.forEach(function(line) {
        ctx.fillText(line, x, yy);
        yy += lineHeight;
      });
      return yy;
    }

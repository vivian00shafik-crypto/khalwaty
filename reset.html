<!DOCTYPE html>
<html lang="ar" dir="rtl"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:sans-serif;padding:24px;font-size:20px">
<p id="m">جاري التنظيف...</p>
<script>
(async()=>{
  let log=[];
  try{
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs){await r.unregister();}
    log.push('service workers: '+regs.length);
    const keys=await caches.keys();
    for(const k of keys){await caches.delete(k);}
    log.push('caches: '+keys.join(', '));
  }catch(e){log.push('خطأ: '+e);}
  document.getElementById('m').innerHTML='تم ✅<br><br>'+log.join('<br>')+
   '<br><br><a href="./?v='+Date.now()+'">افتحي التطبيق</a>';
})();
</script></body></html>
